<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HTMLかんたん作成</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:#eef1f5;
color:#202124;
overflow:hidden;
}

button,input,textarea,select{
font-family:inherit;
}

button{
border:0;
cursor:pointer;
}

header{
height:58px;
background:#202124;
color:#fff;
display:flex;
align-items:center;
padding:0 12px;
gap:8px;
position:relative;
z-index:30;
}

.logo{
font-size:17px;
font-weight:700;
white-space:nowrap;
}

.top-actions{
margin-left:auto;
display:flex;
gap:5px;
}

.top-btn{
height:38px;
padding:0 12px;
border-radius:8px;
background:#3c4043;
color:#fff;
font-size:13px;
}

.top-btn.primary{
background:#1a73e8;
}

.top-btn.save{
background:#188038;
}

main{
height:calc(100vh - 58px);
display:grid;
grid-template-columns:220px minmax(300px,1fr) 285px;
}

.left{
background:#fff;
border-right:1px solid #ddd;
overflow:auto;
}

.center{
min-width:0;
background:#e5e7eb;
display:flex;
flex-direction:column;
}

.right{
background:#fff;
border-left:1px solid #ddd;
overflow:auto;
}

.panel-title{
height:48px;
display:flex;
align-items:center;
padding:0 14px;
font-size:14px;
font-weight:700;
border-bottom:1px solid #eee;
background:#fff;
position:sticky;
top:0;
z-index:10;
}

.parts{
padding:10px;
}

.group-title{
font-size:11px;
font-weight:700;
color:#777;
margin:12px 3px 6px;
}

.part{
width:100%;
height:42px;
background:#f7f8f9;
border:1px solid #e1e3e6;
border-radius:8px;
margin-bottom:6px;
text-align:left;
padding:0 12px;
font-size:13px;
display:flex;
align-items:center;
gap:9px;
}

.part:active{
background:#e8f0fe;
transform:scale(.98);
}

.part-icon{
width:22px;
text-align:center;
font-size:16px;
}

.toolbar{
height:50px;
background:#fff;
border-bottom:1px solid #ddd;
display:flex;
align-items:center;
justify-content:center;
gap:5px;
flex-shrink:0;
}

.device{
height:34px;
padding:0 12px;
border-radius:7px;
background:#f1f3f4;
font-size:12px;
}

.device.active{
background:#1a73e8;
color:#fff;
}

.canvas-area{
flex:1;
overflow:auto;
padding:25px;
}

.canvas{
background:#fff;
min-height:700px;
width:100%;
max-width:1000px;
margin:auto;
padding:25px;
box-shadow:0 2px 12px #0002;
transition:.2s;
}

.canvas.mobile{
width:390px;
max-width:390px;
}

.canvas.tablet{
width:768px;
max-width:768px;
}

.element{
position:relative;
border:2px solid transparent;
border-radius:4px;
padding:3px;
margin:3px 0;
cursor:pointer;
}

.element:hover{
border-color:#8ab4f8;
}

.element.selected{
border-color:#1a73e8;
background:#1a73e80b;
}

.element-tools{
position:absolute;
right:2px;
top:-34px;
display:none;
background:#1a73e8;
padding:3px;
border-radius:7px;
z-index:20;
gap:2px;
}

.element.selected .element-tools{
display:flex;
}

.element-tools button{
background:transparent;
color:#fff;
font-size:11px;
padding:6px 7px;
border-radius:5px;
}

.empty{
height:600px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:#999;
font-size:14px;
border:2px dashed #ddd;
border-radius:10px;
}

.setting-section{
border-bottom:1px solid #eee;
padding:13px;
}

.setting-title{
font-size:13px;
font-weight:700;
margin-bottom:10px;
}

.field{
margin-bottom:10px;
}

.field label{
display:block;
font-size:11px;
font-weight:600;
color:#666;
margin-bottom:4px;
}

input[type=text],
input[type=url],
input[type=number],
select,
textarea{
width:100%;
border:1px solid #d0d3d7;
border-radius:7px;
padding:9px;
font-size:13px;
background:#fff;
outline:none;
}

textarea{
min-height:90px;
resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
border-color:#1a73e8;
box-shadow:0 0 0 2px #1a73e822;
}

input[type=color]{
width:100%;
height:38px;
padding:3px;
border:1px solid #d0d3d7;
border-radius:7px;
background:#fff;
}

input[type=range]{
accent-color:#1a73e8;
}

.range{
display:flex;
align-items:center;
gap:8px;
}

.range input{
flex:1;
}

.range span{
font-size:11px;
min-width:45px;
text-align:right;
}

.two{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
}

.action-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:6px;
margin-top:7px;
}

.action{
height:36px;
border-radius:7px;
background:#f1f3f4;
font-size:12px;
}

.action.red{
background:#d93025;
color:#fff;
}

.no-selection{
padding:25px 15px;
text-align:center;
color:#888;
font-size:13px;
line-height:1.7;
}

.modal{
position:fixed;
inset:0;
background:#0008;
z-index:100;
display:none;
align-items:center;
justify-content:center;
padding:15px;
}

.modal.show{
display:flex;
}

.modal-box{
width:min(1000px,100%);
height:min(800px,100%);
background:#fff;
border-radius:12px;
overflow:hidden;
display:flex;
flex-direction:column;
}

.modal-header{
height:50px;
padding:0 12px;
display:flex;
align-items:center;
border-bottom:1px solid #ddd;
gap:5px;
}

.modal-header strong{
flex:1;
font-size:14px;
}

.code-tabs{
display:flex;
gap:4px;
}

.code-tab{
padding:7px 10px;
border-radius:6px;
background:#f1f3f4;
font-size:12px;
}

.code-tab.active{
background:#1a73e8;
color:#fff;
}

.code{
flex:1;
width:100%;
border:0;
border-radius:0;
background:#171717;
color:#eee;
padding:15px;
font-family:monospace;
font-size:12px;
line-height:1.5;
resize:none;
}

.modal-close{
background:#d93025;
color:#fff;
padding:7px 10px;
border-radius:6px;
font-size:12px;
}

.toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#202124;
color:#fff;
padding:10px 16px;
border-radius:8px;
font-size:13px;
display:none;
z-index:200;
}

.mobile-bottom{
display:none;
}

@media(max-width:900px){

main{
grid-template-columns:180px 1fr;
}

.right{
display:none;
}

}

@media(max-width:600px){

header{
height:56px;
}

.logo{
font-size:15px;
}

.top-btn{
font-size:11px;
padding:0 8px;
}

.top-btn.undo,
.top-btn.redo{
display:none;
}

main{
height:calc(100vh - 56px);
display:block;
position:relative;
}

.left{
display:none;
}

.center{
height:100%;
}

.right{
display:none;
}

.toolbar{
height:48px;
}

.device{
padding:0 9px;
font-size:11px;
}

.canvas-area{
padding:10px;
padding-bottom:70px;
}

.canvas{
padding:15px;
min-height:calc(100vh - 130px);
}

.canvas.mobile{
width:100%;
max-width:none;
}

.mobile-bottom{
position:fixed;
display:flex;
bottom:0;
left:0;
right:0;
height:62px;
background:#fff;
border-top:1px solid #ddd;
z-index:50;
padding:7px;
gap:6px;
}

.mobile-bottom button{
flex:1;
background:#f1f3f4;
border-radius:8px;
font-size:11px;
}

}

@media(max-width:380px){

.logo{
font-size:14px;
}

.top-btn{
padding:0 6px;
}

}
</style>
</head>

<body>

<header>

<div class="logo">HTMLかんたん作成</div>

<div class="top-actions">
<button class="top-btn undo" onclick="undo()">↶</button>
<button class="top-btn redo" onclick="redo()">↷</button>
<button class="top-btn" onclick="newProject()">新規</button>
<button class="top-btn primary" onclick="openCode()">HTML</button>
<button class="top-btn save" onclick="downloadHTML()">保存</button>
</div>

</header>

<main>

<aside class="left">

<div class="panel-title">部品</div>

<div class="parts">

<div class="group-title">基本</div>

<button class="part" onclick="addElement('heading')">
<span class="part-icon">H</span>見出し
</button>

<button class="part" onclick="addElement('text')">
<span class="part-icon">T</span>文章
</button>

<button class="part" onclick="addElement('button')">
<span class="part-icon">▣</span>ボタン
</button>

<button class="part" onclick="addElement('link')">
<span class="part-icon">🔗</span>リンク
</button>

<button class="part" onclick="addElement('image')">
<span class="part-icon">🖼</span>画像
</button>

<button class="part" onclick="addElement('video')">
<span class="part-icon">▶</span>動画
</button>

<button class="part" onclick="addElement('youtube')">
<span class="part-icon">▶</span>YouTube
</button>

<div class="group-title">フォーム</div>

<button class="part" onclick="addElement('input')">
<span class="part-icon">▭</span>入力欄
</button>

<button class="part" onclick="addElement('textarea')">
<span class="part-icon">▤</span>文章入力
</button>

<button class="part" onclick="addElement('checkbox')">
<span class="part-icon">☑</span>チェック
</button>

<button class="part" onclick="addElement('radio')">
<span class="part-icon">◉</span>ラジオ
</button>

<button class="part" onclick="addElement('select')">
<span class="part-icon">▾</span>選択
</button>

<div class="group-title">レイアウト</div>

<button class="part" onclick="addElement('card')">
<span class="part-icon">▣</span>カード
</button>

<button class="part" onclick="addElement('container')">
<span class="part-icon">□</span>コンテナ
</button>

<button class="part" onclick="addElement('list')">
<span class="part-icon">☷</span>リスト
</button>

<button class="part" onclick="addElement('table')">
<span class="part-icon">▦</span>表
</button>

<button class="part" onclick="addElement('line')">
<span class="part-icon">―</span>区切り線
</button>

<button class="part" onclick="addElement('space')">
<span class="part-icon">↕</span>空白
</button>

<button class="part" onclick="addElement('html')">
<span class="part-icon">&lt;&gt;</span>HTML
</button>

</div>

</aside>

<section class="center">

<div class="toolbar">

<button class="device active" id="desktop" onclick="setDevice('desktop')">
🖥 PC
</button>

<button class="device" id="tablet" onclick="setDevice('tablet')">
▣ タブレット
</button>

<button class="device" id="mobile" onclick="setDevice('mobile')">
📱 スマホ
</button>

</div>

<div class="canvas-area">

<div id="canvas" class="canvas">

<div class="empty">
左側の「部品」から<br>
追加したいものをタップしてください
</div>

</div>

</div>

</section>

<aside class="right">

<div class="panel-title">設定</div>

<div id="settings">

<div class="no-selection">
部品を選択すると<br>
ここに設定が表示されます
</div>

</div>

</aside>

</main>

<div class="mobile-bottom">

<button onclick="mobileParts()">＋ 部品</button>
<button onclick="mobileSettings()">⚙ 設定</button>
<button onclick="openCode()">HTML</button>
<button onclick="downloadHTML()">保存</button>

</div>

<div class="modal" id="codeModal">

<div class="modal-box">

<div class="modal-header">

<strong>生成コード</strong>

<div class="code-tabs">

<button class="code-tab active" id="tabHTML" onclick="showCode('html')">
HTML
</button>

<button class="code-tab" id="tabCSS" onclick="showCode('css')">
CSS
</button>

<button class="code-tab" id="tabJS" onclick="showCode('js')">
JS
</button>

</div>

<button onclick="copyCode()">コピー</button>

<button class="modal-close" onclick="closeCode()">閉じる</button>

</div>

<textarea id="code" class="code" readonly></textarea>

</div>

</div>

<div id="toast" class="toast"></div>

<script>

let elements=[];
let selectedId=null;
let nextId=1;

let history=[];
let historyIndex=-1;

let customCSS="";
let customJS="";

let editing=false;


function getState(){

return JSON.stringify({
elements:elements,
nextId:nextId,
customCSS:customCSS,
customJS:customJS
});

}


function saveHistory(){

let current=getState();

if(history[historyIndex]===current)return;

history=history.slice(0,historyIndex+1);

history.push(current);

if(history.length>50){
history.shift();
}

historyIndex=history.length-1;

}


function restoreState(data){

let obj=JSON.parse(data);

elements=obj.elements||[];
nextId=obj.nextId||1;
customCSS=obj.customCSS||"";
customJS=obj.customJS||"";

selectedId=null;

render();

}


function undo(){

if(historyIndex<=0)return;

historyIndex--;

restoreState(history[historyIndex]);

}


function redo(){

if(historyIndex>=history.length-1)return;

historyIndex++;

restoreState(history[historyIndex]);

}


function createElement(type){

let e={
id:nextId++,
type:type,
text:"",
url:"",
src:"",
alt:"",
placeholder:"",
level:"h1",
color:"#222222",
background:"#ffffff",
fontSize:16,
fontWeight:"normal",
textAlign:"left",
width:"100%",
height:"",
padding:10,
margin:5,
border:"none",
borderWidth:1,
borderColor:"#cccccc",
borderRadius:6,
shadow:false,
opacity:1
};

if(type==="heading"){
e.text="見出し";
}

if(type==="text"){
e.text="ここに文章を入力してください。";
}

if(type==="button"){
e.text="ボタン";
e.url="#";
e.background="#1a73e8";
e.color="#ffffff";
}

if(type==="link"){
e.text="リンク";
e.url="https://example.com";
}

if(type==="image"){
e.src="";
e.alt="画像";
}

if(type==="video"){
e.src="";
}

if(type==="youtube"){
e.src="";
}

if(type==="input"){
e.placeholder="入力してください";
}

if(type==="textarea"){
e.placeholder="文章を入力してください";
e.height="120px";
}

if(type==="checkbox"){
e.text="同意する";
}

if(type==="radio"){
e.text="選択肢";
}

if(type==="select"){
e.text="選択肢1,選択肢2,選択肢3";
}

if(type==="list"){
e.text="項目1,項目2,項目3";
}

if(type==="table"){
e.text="名前,年齢,地域\nひろ,15,日本\nユーザー,20,東京";
}

if(type==="card"){
e.text="カードタイトル\nカードの説明です。";
e.background="#f5f5f5";
e.padding=20;
e.border="solid";
}

if(type==="container"){
e.background="#fafafa";
e.padding=20;
e.border="solid";
e.height="100px";
}

if(type==="line"){
e.margin=15;
}

if(type==="space"){
e.height="30px";
}

if(type==="html"){
e.text="<div>HTML</div>";
}

return e;

}


function addElement(type){

saveHistory();

let e=createElement(type);

elements.push(e);

selectedId=e.id;

render();

if(window.innerWidth<=600){
openMobileSettings();
}

}


function deleteElement(id){

saveHistory();

elements=elements.filter(e=>e.id!==id);

if(selectedId===id){
selectedId=null;
}

render();

}


function duplicateElement(id){

saveHistory();

let index=elements.findIndex(e=>e.id===id);

if(index===-1)return;

let copy=JSON.parse(JSON.stringify(elements[index]));

copy.id=nextId++;

elements.splice(index+1,0,copy);

selectedId=copy.id;

render();

}


function moveElement(id,direction){

let index=elements.findIndex(e=>e.id===id);

if(index===-1)return;

let target=index+direction;

if(target<0||target>=elements.length)return;

saveHistory();

let item=elements.splice(index,1)[0];

elements.splice(target,0,item);

render();

}


function render(){

renderCanvas();
renderSettings();

}


function renderCanvas(){

let canvas=document.getElementById("canvas");

if(elements.length===0){

canvas.innerHTML=`
<div class="empty">
左側の「部品」から<br>
追加したいものをタップしてください
</div>`;

return;

}

canvas.innerHTML="";

elements.forEach(e=>{

let wrapper=document.createElement("div");

wrapper.className="element";

wrapper.dataset.id=e.id;

if(e.id===selectedId){
wrapper.classList.add("selected");
}

wrapper.addEventListener("click",function(event){

event.stopPropagation();

selectedId=e.id;

render();

});


let tools=document.createElement("div");

tools.className="element-tools";

tools.innerHTML=`
<button type="button">↑</button>
<button type="button">↓</button>
<button type="button">複製</button>
<button type="button">削除</button>
`;

let buttons=tools.querySelectorAll("button");

buttons[0].onclick=function(event){
event.stopPropagation();
moveElement(e.id,-1);
};

buttons[1].onclick=function(event){
event.stopPropagation();
moveElement(e.id,1);
};

buttons[2].onclick=function(event){
event.stopPropagation();
duplicateElement(e.id);
};

buttons[3].onclick=function(event){
event.stopPropagation();
deleteElement(e.id);
};

wrapper.appendChild(tools);

let content=document.createElement("div");

content.innerHTML=getElementHTML(e);

wrapper.appendChild(content);

canvas.appendChild(wrapper);

});

}


function getStyle(e){

return `
color:${e.color};
background:${e.background};
font-size:${e.fontSize}px;
font-weight:${e.fontWeight};
text-align:${e.textAlign};
width:${e.width};
${e.height?`height:${e.height};`:""}
padding:${e.padding}px;
margin:${e.margin}px;
border:${e.border};
border-width:${e.borderWidth}px;
border-color:${e.borderColor};
border-radius:${e.borderRadius}px;
opacity:${e.opacity};
${e.shadow?"box-shadow:0 4px 16px #0003;":""}
`;

}


function getElementHTML(e){

let s=getStyle(e);

if(e.type==="heading"){
return `<${e.level} style="${s}">${esc(e.text)}</${e.level}>`;
}

if(e.type==="text"){
return `<p style="${s}">${esc(e.text).replace(/\n/g,"<br>")}</p>`;
}

if(e.type==="button"){
return `<button type="button" style="${s}" onclick="location.href='${attr(e.url)}'">${esc(e.text)}</button>`;
}

if(e.type==="link"){
return `<a href="${attr(e.url)}" style="${s}">${esc(e.text)}</a>`;
}

if(e.type==="image"){

if(!e.src){
return `<div style="${s};min-height:100px;background:#eee;display:flex;align-items:center;justify-content:center">画像URLを設定してください</div>`;
}

return `<img src="${attr(e.src)}" alt="${attr(e.alt)}" style="${s};max-width:100%;height:auto">`;

}

if(e.type==="video"){
return `<video src="${attr(e.src)}" controls style="${s};max-width:100%"></video>`;
}

if(e.type==="youtube"){

let id=getYoutubeId(e.src);

if(!id){
return `<div style="${s};min-height:100px;background:#eee;display:flex;align-items:center;justify-content:center">YouTube URLを設定してください</div>`;
}

return `<iframe src="https://www.youtube.com/embed/${id}" style="${s};height:315px;border:0" allowfullscreen></iframe>`;

}

if(e.type==="input"){
return `<input type="text" placeholder="${attr(e.placeholder)}" style="${s}">`;
}

if(e.type==="textarea"){
return `<textarea placeholder="${attr(e.placeholder)}" style="${s}"></textarea>`;
}

if(e.type==="checkbox"){
return `<label style="${s};display:block"><input type="checkbox"> ${esc(e.text)}</label>`;
}

if(e.type==="radio"){
return `<label style="${s};display:block"><input type="radio" name="radio-group"> ${esc(e.text)}</label>`;
}

if(e.type==="select"){

let list=e.text.split(",").filter(x=>x.trim());

return `<select style="${s}">${list.map(x=>`<option>${esc(x.trim())}</option>`).join("")}</select>`;

}

if(e.type==="list"){

let list=e.text.split(",").filter(x=>x.trim());

return `<ul style="${s}">${list.map(x=>`<li>${esc(x.trim())}</li>`).join("")}</ul>`;

}

if(e.type==="table"){

let rows=e.text.split("\n");

return `<table style="${s};border-collapse:collapse">
${rows.map((row,index)=>`
<tr>
${row.split(",").map(cell=>{
return index===0
?`<th style="border:1px solid ${e.borderColor};padding:8px">${esc(cell.trim())}</th>`
:`<td style="border:1px solid ${e.borderColor};padding:8px">${esc(cell.trim())}</td>`;
}).join("")}
</tr>
`).join("")}
</table>`;

}

if(e.type==="card"){

let lines=e.text.split("\n");

return `<div style="${s}">
<strong>${esc(lines[0]||"")}</strong>

}

if(e.type==="container"){

}

if(e.type==="line"){
return `<hr style="border:0;border-top:${e.borderWidth}px solid ${e.borderColor};margin:${e.margin}px 0">`;
}

if(e.type==="space"){
return `<div style="height:${e.height||"30px"}"></div>`;
}

if(e.type==="html"){
return e.text;
}

return "";

}

function bindSettings(e){

let inputs=document.querySelectorAll("#settings [data-key]");

inputs.forEach(input=>{

let key=input.dataset.key;

if(input.type==="checkbox"){
input.checked=Boolean(e[key]);
}else{
input.value=e[key]??"";
}

input.addEventListener("input",function(){

if(input.type==="checkbox"){
e[key]=input.checked;
}else{
e[key]=input.value;
}

renderCanvas();

updateRangeLabel(input,e[key],key);

});

input.addEventListener("change",function(){

saveHistory();

});

});

}


function updateRangeLabel(input,value,key){

if(input.type!=="range")return;

let span=input.parentElement.querySelector("span");

if(!span)return;

span.textContent=key==="fontSize"
?value+"px"
:value;

}


function setDevice(type){

let canvas=document.getElementById("canvas");

canvas.classList.remove("mobile","tablet");

document.querySelectorAll(".device").forEach(x=>{
x.classList.remove("active");
});

if(type==="mobile"){

canvas.classList.add("mobile");

document.getElementById("mobile").classList.add("active");

}

if(type==="tablet"){

canvas.classList.add("tablet");

document.getElementById("tablet").classList.add("active");

}

if(type==="desktop"){

document.getElementById("desktop").classList.add("active");

}

}
