<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTMLかんたん作成</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f3f5;color:#222}
header{background:#202124;color:white;padding:15px 18px;font-size:20px;font-weight:bold}
main{display:grid;grid-template-columns:280px 1fr 1fr;gap:15px;padding:15px;max-width:1400px;margin:auto}
.panel{background:white;border-radius:12px;padding:15px;box-shadow:0 2px 8px #0001}
h2{font-size:17px;margin:0 0 12px}
button{border:0;border-radius:8px;padding:10px 12px;background:#222;color:white;font-size:14px;cursor:pointer;margin:3px 0}
button:hover{opacity:.8}
.add{width:100%;background:#3b82f6}
input,select,textarea{width:100%;padding:9px;border:1px solid #ccc;border-radius:7px;font-size:14px;margin:5px 0 10px}
textarea{height:400px;font-family:monospace;resize:vertical}
.item{border:1px solid #ddd;border-radius:8px;padding:10px;margin-bottom:8px;background:#fafafa}
.item strong{display:block;margin-bottom:7px}
.item button{font-size:12px;padding:6px 9px}
.delete{background:#d33}
.move{background:#666}
#preview{min-height:500px;border:1px solid #ddd;border-radius:8px;background:white;padding:15px}
#code{height:500px;background:#181818;color:#eee}
.row{display:flex;gap:5px}
.row button{flex:1}
.empty{color:#888;text-align:center;padding:30px 5px}
@media(max-width:1000px){
main{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>HTMLかんたん作成</header>

<main>

<div class="panel">
<h2>部品を追加</h2>

<button class="add" onclick="addElement('heading')">＋ 見出し</button>
<button class="add" onclick="addElement('text')">＋ 文章</button>
<button class="add" onclick="addElement('button')">＋ ボタン</button>
<button class="add" onclick="addElement('link')">＋ リンク</button>
<button class="add" onclick="addElement('image')">＋ 画像</button>
<button class="add" onclick="addElement('input')">＋ 入力欄</button>
<button class="add" onclick="addElement('line')">＋ 区切り線</button>
<button class="add" onclick="addElement('space')">＋ 空白</button>

<h2 style="margin-top:20px">ページ設定</h2>

<label>タイトル</label>
<input id="pageTitle" value="My Website" oninput="update()">

<label>背景色</label>
<input id="bgColor" type="color" value="#ffffff" oninput="update()">

<label>文字色</label>
<input id="textColor" type="color" value="#222222" oninput="update()">

</div>

<div class="panel">
<h2>配置</h2>
<div id="elements"></div>
</div>

<div class="panel">
<h2>プレビュー</h2>
<div id="preview"></div>

<h2 style="margin-top:20px">HTML</h2>
<textarea id="code" readonly></textarea>

<div class="row">
<button onclick="copyCode()">コピー</button>
<button onclick="downloadHTML()">HTMLを保存</button>
</div>
</div>

</main>

<script>
let elements=[];
let nextId=1;

function addElement(type){
let e={
id:nextId++,
type:type,
text:"",
url:"",
src:"",
placeholder:""
};

if(type==="heading")e.text="見出し";
if(type==="text")e.text="ここに文章を入力";
if(type==="button")e.text="ボタン";
if(type==="link"){
e.text="リンク";
e.url="https://example.com";
}
if(type==="image"){
e.src="https://via.placeholder.com/400x200";
}
if(type==="input"){
e.placeholder="入力してください";
}

elements.push(e);
render();
}

function removeElement(id){
elements=elements.filter(e=>e.id!==id);
render();
}

function moveElement(id,direction){
let index=elements.findIndex(e=>e.id===id);
let newIndex=index+direction;

if(newIndex<0||newIndex>=elements.length)return;

[elements[index],elements[newIndex]]=[
elements[newIndex],
elements[index]
];

render();
}

function editElement(id,key,value){
let e=elements.find(x=>x.id===id);
if(e)e[key]=value;
update();
}

function render(){
let container=document.getElementById("elements");

if(elements.length===0){
container.innerHTML='<div class="empty">左から部品を追加してください</div>';
update();
return;
}

container.innerHTML="";

elements.forEach((e,index)=>{

let div=document.createElement("div");
div.className="item";

let title={
heading:"見出し",
text:"文章",
button:"ボタン",
link:"リンク",
image:"画像",
input:"入力欄",
line:"区切り線",
space:"空白"
}[e.type];

div.innerHTML="<strong>"+(index+1)+". "+title+"</strong>";

if(e.type==="heading"){
div.innerHTML+=`
<select onchange="editElement(${e.id},'level',this.value)">
<option value="h1">大見出し</option>
<option value="h2">中見出し</option>
<option value="h3">小見出し</option>
</select>
<input value="${escapeAttr(e.text)}" oninput="editElement(${e.id},'text',this.value)" placeholder="見出し">
`;
}

if(e.type==="text"){
div.innerHTML+=`
<textarea style="height:80px" oninput="editElement(${e.id},'text',this.value)" placeholder="文章">${escapeText(e.text)}</textarea>
`;
}

if(e.type==="button"){
div.innerHTML+=`
<input value="${escapeAttr(e.text)}" oninput="editElement(${e.id},'text',this.value)" placeholder="ボタン文字">
<input value="${escapeAttr(e.url||"")}" oninput="editElement(${e.id},'url',this.value)" placeholder="リンク先URL">
`;
}

if(e.type==="link"){
div.innerHTML+=`
<input value="${escapeAttr(e.text)}" oninput="editElement(${e.id},'text',this.value)" placeholder="表示文字">
<input value="${escapeAttr(e.url)}" oninput="editElement(${e.id},'url',this.value)" placeholder="URL">
`;
}

if(e.type==="image"){
div.innerHTML+=`
<input value="${escapeAttr(e.src)}" oninput="editElement(${e.id},'src',this.value)" placeholder="画像URL">
`;
}

if(e.type==="input"){
div.innerHTML+=`
<input value="${escapeAttr(e.placeholder)}" oninput="editElement(${e.id},'placeholder',this.value)" placeholder="プレースホルダー">
`;
}

if(e.type==="line"){
div.innerHTML+="<div style='color:#777'>横線を表示します</div>";
}

if(e.type==="space"){
div.innerHTML+="<div style='color:#777'>空白を表示します</div>";
}

div.innerHTML+=`
<div class="row">
<button class="move" onclick="moveElement(${e.id},-1)">↑</button>
<button class="move" onclick="moveElement(${e.id},1)">↓</button>
<button class="delete" onclick="removeElement(${e.id})">削除</button>
</div>
`;

container.appendChild(div);
});

update();
}

function generateHTML(){

let title=escapeHTML(document.getElementById("pageTitle").value);
let bg=document.getElementById("bgColor").value;
let color=document.getElementById("textColor").value;

let body="";

elements.forEach(e=>{

if(e.type==="heading"){
let level=e.level||"h1";
body+=`<${level}>${escapeHTML(e.text)}</${level}>\n`;
}

if(e.type==="text"){
body+=`<p>${escapeHTML(e.text).replace(/\n/g,"<br>")}</p>\n`;
}

if(e.type==="button"){
body+=`<button onclick="location.href='${escapeAttr(e.url||"#")}'">${escapeHTML(e.text)}</button>\n`;
}

if(e.type==="link"){
body+=`<p><a href="${escapeAttr(e.url)}">${escapeHTML(e.text)}</a></p>\n`;
}

if(e.type==="image"){
body+=`<img src="${escapeAttr(e.src)}" style="max-width:100%;">\n`;
}

if(e.type==="input"){
body+=`<input type="text" placeholder="${escapeAttr(e.placeholder)}">\n`;
}

if(e.type==="line"){
body+="<hr>\n";
}

if(e.type==="space"){
body+='<div style="height:30px"></div>\n';
}

});

return `<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${title}</title>
<style>
body{
margin:0;
padding:30px;
font-family:Arial,sans-serif;
background:${bg};
color:${color};
}
button,input{
padding:10px;
margin:5px;
}
img{
display:block;
margin:10px 0;
}
</style>
</head>
<body>

${body}
</body>
</html>`;
}

function update(){

let html=generateHTML();

document.getElementById("code").value=html;

let preview=document.getElementById("preview");

preview.innerHTML="";

let frame=document.createElement("iframe");

frame.style.width="100%";
frame.style.height="500px";
frame.style.border="0";
frame.srcdoc=html;

preview.appendChild(frame);
}

function copyCode(){

navigator.clipboard.writeText(
document.getElementById("code").value
);

let buttons=document.querySelectorAll(".row button");

buttons[0].textContent="コピーしました";

setTimeout(()=>{
buttons[0].textContent="コピー";
},1500);
}

function downloadHTML(){

let html=document.getElementById("code").value;

let blob=new Blob(
[html],
{type:"text/html;charset=utf-8"}
);

let url=URL.createObjectURL(blob);

let a=document.createElement("a");

a.href=url;
a.download="index.html";

a.click();

URL.revokeObjectURL(url);
}

function escapeHTML(str){
return String(str)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function escapeAttr(str){
return escapeHTML(str);
}

function escapeText(str){
return String(str)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");
}

render();
</script>

</body>
</html>
